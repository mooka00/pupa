<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Прокат настольных игр</h1>
    <input type="checkbox" id="filter">
    <label for="filter">Показать только свободные</label>
    <p id="hint"></p>

    <label for="gameSelect">Игра</label>
    <select id="gameSelect">
    </select>

    <label for="borrowerName">Имя посетителя</label>
    <input id="borrowerName" type="text">
    <button id="borrowButton" type="button">Выдать</button>
    <button id="returnButton" type="button">Вернуть</button>
    <ul id="gameList"></ul>
    <div>
        <input type="text" id="game">
        <label for="game">напишите название игры</label>
    </div>
    <div>
        <input type="number" min="0" step="1" id="player">
        <label for="player">напишите количество игроков</label>
    </div>
    <div>
        <input type="number" min="0" step="1" id="copies">
        <label for="copies">напишите количество копий</label>
    </div>
    <button id="add">добавить</button>
    <p id="message"></p>

    
</body>
</html>
